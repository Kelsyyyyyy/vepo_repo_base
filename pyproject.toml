[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vepo"
version = "0.1.0"
description = "Control operativo de la purificadora Agua Inmaculada (sucursal Porfirio Díaz)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "bcrypt>=4.2",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: estilo pycodestyle · F: errores · I: orden de imports · N: nombres
# D: docstrings · B: errores comunes · UP: sintaxis moderna
select = ["E", "W", "F", "I", "N", "D", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
